<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  grid-template-rows: auto auto 1fr;
  gap: 20px;  
  padding: 10px;
  background: white;
}

    .box {
  width: 100px;
  height: 100px;
  background: #9e9e9e;
  border-radius: 6px;
  margin: 10px;  
    }

    .box1 { grid-column: 1; grid-row: 1; }
    .box2 { grid-column: 2; grid-row: 1; }

    .box3 { grid-column: 4; grid-row: 1; justify-self: end; }

    .box4 { grid-column: 1; grid-row: 2; }

    .box5 {grid-column: 4; 
      grid-row: 3; 
      justify-self: end; 
      align-self: end;  
    }

  </style>
</head>
<body>

  <div class="box box1"></div>
  <div class="box box2"></div>
  <div class="box box3"></div>
  <div class="box box4"></div>
  <div class="box box5"></div>

</body>
</html>
